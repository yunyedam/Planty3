const Chart=({timeline})=>{
const data=getGrowth(timeline);
if(!data.length) return(
<div style={{color:GRAY,fontSize:12,textAlign:“center”,padding:24,lineHeight:1.9}}>

</div>
);
const W=300,H=100,PAD=10,aw=W-PAD*2;
const n=data.length;
const mh=Math.max(…data.map(d=>d.height||0),1);
const ml=Math.max(…data.map(d=>d.leaves||0),1);
const bw=Math.max(8,Math.min(28,aw/n*0.5));
const xOf=(i)=>PAD+aw/n*i+aw/n/2;
return(
<svg width={W} height={H+44} style={{display:“block”,overflow:“visible”}}>
{[0,0.5,1].map((r,i)=>(
<line key={i} x1={PAD} y1={H-H*r} x2={W-PAD} y2={H-H*r}
stroke=”#333” strokeWidth={1} strokeDasharray={r===0?””:“3,3”}/>
))}
{data.map((d,i)=>{
const x=xOf(i);
const hh=d.height!=null?Math.max(4,d.height/mh*H):0;
const lh=d.leaves!=null?Math.max(4,d.leaves/ml*H*0.55):0;
return(
<g key={i}>
{d.height!=null&&<>
<rect x={x-bw/2} y={H-hh} width={bw} height={hh} fill={NEON} rx={3} opacity={0.88}/>
<text x={x} y={H-hh-5} textAnchor="middle" fontSize={9} fill={NEON}>{d.height}</text>
</>}
{d.leaves!=null&&<>
<circle cx={x} cy={H-lh} r={5} fill="#FF9F43"/>
<text x={x+8} y={H-lh+4} fontSize={9} fill="#FF9F43">{d.leaves}</text>
</>}
<text x={x} y={H+14} textAnchor="middle" fontSize={8} fill={GRAY}>{d.date}</text>
</g>
);
})}
<rect x={PAD} y={H+24} width={10} height={10} fill={NEON} rx={2}/>
<text x={PAD+14} y={H+33} fontSize={9} fill={NEON}>키(cm)</text>
<circle cx={PAD+58} cy={H+29} r={5} fill="#FF9F43"/>
<text x={PAD+66} y={H+33} fontSize={9} fill="#FF9F43">잎(장)</text>
</svg>
);
};
